<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d9772b">
<title>레시피 카드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",sans-serif;background:#faf6ee;color:#2b2118}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #eadfcc;position:sticky;top:0;z-index:5}
header a.logo{font-weight:700;font-size:18px;text-decoration:none;color:#2b2118}
main{padding:12px;max-width:760px;margin:auto;padding-bottom:90px}
.btn,button{background:#d9772b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;text-decoration:none;display:inline-block;cursor:pointer;font-family:inherit}
.btn.gray,button.gray{background:#8a7d6b}
.btn.red,button.red{background:#c0392b}
input[type=text],textarea{width:100%;padding:10px;border:1px solid #d9ccb5;border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
textarea{min-height:260px}
label.f{display:block;margin:12px 0 4px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.item{position:relative;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0002;font-size:14px}
.item img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
.item .t{padding:8px}
.item input{position:absolute;top:8px;left:8px;width:24px;height:24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tag{display:inline-block;background:#f1e4cc;border-radius:99px;padding:4px 10px;margin:2px;font-size:13px;text-decoration:none;color:#7a4a17;cursor:pointer}
.tag.on{background:#d9772b;color:#fff}
.search{display:flex;gap:8px}
.card img{width:100%;border-radius:12px;display:block}
.note{background:#fff3cd;padding:10px;border-radius:10px;margin:8px 0;font-size:14px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:1px solid #eadfcc;padding:10px 12px;display:flex;gap:8px;justify-content:center;z-index:6}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#2b2118;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:.95}
small.hint{color:#8a7d6b}
.foot{margin-top:24px;padding-top:12px;border-top:1px dashed #d9ccb5}
</style>
</head>
<body>
<header><a class="logo" href="#/">🍳 레시피 카드</a><a class="btn" href="#/new">+ 새 레시피</a></header>
<main id="app"></main>
<div id="toast"></div>

<script>
"use strict";
/* ============================== 유틸 ============================== */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseTags = s => (s || "").split(/[,\s#]+/).filter(Boolean);
const FONT = '"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
let urls = [];
const objUrl = b => { const u = URL.createObjectURL(b); urls.push(u); return u; };
const state = { q: "", tag: "", sel: new Set() };
const pending = new Set(), failed = new Set();

let toastTimer;
function toast(msg, ms = 2600) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
const safeName = s => (s || "recipe").replace(/[\\/:*?"<>|]/g, "").trim() || "recipe";
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

/* ============================== 저장소 (IndexedDB) ============================== */
let _db;
function openDB() {
  return _db || (_db = new Promise((res, rej) => {
    const q = indexedDB.open("recipecards", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("recipes", { keyPath: "id", autoIncrement: true });
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  }));
}
async function tx(mode, fn) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const t = d.transaction("recipes", mode);
    const r = fn(t.objectStore("recipes"));
    t.oncomplete = () => res(r.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const dbAll = async () => (await tx("readonly", s => s.getAll())).sort((a, b) => b.id - a.id);
const dbGet = id => tx("readonly", s => s.get(id));
const dbPut = rec => tx("readwrite", s => s.put(rec));
const dbDel = id => tx("readwrite", s => s.delete(id));

/* ============================== 카드 그리기 (canvas) ============================== */
function wrapText(ctx, text, maxw) {
  const out = [];
  for (const para of (text || "").replace(/\r/g, "").split("\n")) {
    if (!para.trim()) { out.push(""); continue; }
    let line = "";
    for (const ch of para) {
      if (ctx.measureText(line + ch).width <= maxw) line += ch;
      else {
        const sp = line.lastIndexOf(" ");
        if (sp > 0 && /[A-Za-z0-9]/.test(ch)) { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
        else { out.push(line); line = ch.trimStart(); }
      }
    }
    out.push(line);
  }
  return out;
}

async function renderCard(rec) {
  const W = 1080, P = 64, PH = 720;
  const FT = `bold 64px ${FONT}`, FB = `38px ${FONT}`, FS = `32px ${FONT}`;
  const m = document.createElement("canvas").getContext("2d");
  m.font = FT; const tl = wrapText(m, rec.title, W - 2 * P);
  m.font = FB; const bl = wrapText(m, rec.body, W - 2 * P);
  const tags = parseTags(rec.tags).map(t => "#" + t).join(" ");
  const H = Math.ceil(PH + P / 2 + tl.length * 82 + (tags ? 50 : 0) + 40 + bl.length * 56 + P + 60);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#fdf9f1"; x.fillRect(0, 0, W, H);
  if (rec.photo) {
    const bmp = await createImageBitmap(rec.photo);
    const s = Math.max(W / bmp.width, PH / bmp.height), sw = W / s, sh = PH / s;
    x.drawImage(bmp, (bmp.width - sw) / 2, (bmp.height - sh) / 2, sw, sh, 0, 0, W, PH);
  } else {
    x.fillStyle = "#eecda0"; x.fillRect(0, 0, W, PH);
    x.fillStyle = "#fff"; x.font = FB; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("NO PHOTO", W / 2, PH / 2);
  }
  x.textAlign = "left"; x.textBaseline = "top";
  let y = PH + P / 2;
  x.font = FT; x.fillStyle = "#281e14";
  for (const l of tl) { x.fillText(l, P, y); y += 82; }
  if (tags) { x.font = FS; x.fillStyle = "#c86428"; x.fillText(tags, P, y); y += 50; }
  y += 10;
  x.strokeStyle = "#dccdb9"; x.lineWidth = 3; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke(); y += 24;
  x.font = FB; x.fillStyle = "#3c3228";
  for (const l of bl) { x.fillText(l, P, y); y += 56; }
  x.font = FS; x.fillStyle = "#beb4a5"; x.textAlign = "right"; x.textBaseline = "alphabetic";
  x.fillText("Recipe Card", W - P, H - 28);
  return new Promise(r => c.toBlob(r, "image/png"));
}

/* ============================== AI 사진 (Pollinations, 키 불필요) ============================== */
async function genPhoto(title, prompt) {
  const p = (prompt || "").trim() || `${title}, delicious homemade dish, appetizing food photography, natural light, top view`;
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=768&nologo=true&seed=${Math.floor(Math.random() * 99999)}`;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 120000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error("http " + r.status);
    const b = await r.blob();
    if (!b.type.startsWith("image")) throw new Error("not image");
    return b;
  } catch (e) { console.warn("사진 생성 실패", e); return null; }
  finally { clearTimeout(t); }
}

async function startGen(id) {
  pending.add(id); failed.delete(id); refreshIfRelevant();
  const r0 = await dbGet(id);
  const blob = r0 ? await genPhoto(r0.title, r0.prompt) : null;
  pending.delete(id);
  if (blob) {
    const rec = await dbGet(id);
    if (rec) { rec.photo = blob; rec.card = await renderCard(rec); await dbPut(rec); toast("AI 사진이 들어갔어요"); }
  } else { failed.add(id); toast("AI 사진 생성 실패 (인터넷 확인)"); }
  refreshIfRelevant();
}

async function shrinkImage(file, max = 1600) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
}

/* ============================== PDF (라이브러리 없이 직접 생성) ============================== */
function makePDF(pages) {
  const enc = new TextEncoder();
  const chunks = [], offs = []; let len = 0;
  const push = b => { if (typeof b === "string") b = enc.encode(b); chunks.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); push(body); push("\nendobj\n"); };
  push("%PDF-1.4\n");
  const n = pages.length;
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + 3 * i} 0 R`).join(" ")}] /Count ${n} >>`);
  pages.forEach((c, i) => {
    const PW = 595, PH = Math.round(595 * c.h / c.w), p = 3 + 3 * i;
    obj(p, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${p + 2} 0 R >> >> /Contents ${p + 1} 0 R >>`);
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(p + 1, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[p + 2] = len;
    push(`${p + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.w} /Height ${c.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${c.jpeg.length} >>\nstream\n`);
    push(c.jpeg); push("\nendstream\nendobj\n");
  });
  const total = 3 + 3 * n, xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  push(x);
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks, { type: "application/pdf" });
}

async function exportPDF(ids) {
  ids = [...ids].sort((a, b) => a - b);
  if (!ids.length) { toast("선택된 레시피가 없어요"); return; }
  toast("PDF 만드는 중…", 8000);
  const pages = [];
  for (const id of ids) {
    const rec = await dbGet(id); if (!rec) continue;
    const bmp = await createImageBitmap(rec.card);
    const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
    c.getContext("2d").drawImage(bmp, 0, 0);
    const jb = await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
    pages.push({ jpeg: new Uint8Array(await jb.arrayBuffer()), w: c.width, h: c.height });
  }
  if (!pages.length) return;
  download(makePDF(pages), ids.length === 1 ? "recipe.pdf" : "recipes.pdf");
  toast(`PDF 저장 (${pages.length}장)`);
}

/* ============================== 백업 ============================== */
async function exportBackup() {
  const rows = await dbAll();
  const out = [];
  for (const r of rows.slice().reverse())
    out.push({ title: r.title, body: r.body, tags: r.tags, prompt: r.prompt, created: r.created,
               photo: r.photo ? await blobToDataURL(r.photo) : null });
  const d = new Date(), ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  download(new Blob([JSON.stringify({ version: 1, recipes: out })], { type: "application/json" }), `recipe-backup-${ymd}.json`);
  toast(`백업 저장 (${out.length}개)`);
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("백업 파일을 읽을 수 없어요"); return; }
  const list = data.recipes || [];
  const have = new Set((await dbAll()).map(r => r.title + "|" + r.created));
  let added = 0;
  toast("불러오는 중…", 8000);
  for (const r of list) {
    const created = r.created || new Date().toISOString();
    if (have.has(r.title + "|" + created)) continue;
    const rec = { title: r.title || "(제목 없음)", body: r.body || "", tags: r.tags || "", prompt: r.prompt || "", created, photo: null };
    if (r.photo) { try { rec.photo = await (await fetch(r.photo)).blob(); } catch {} }
    rec.card = await renderCard(rec);
    await dbPut(rec); added++;
  }
  toast(`${added}개 불러왔어요 (중복 ${list.length - added}개 건너뜀)`);
  route();
}

/* ============================== 화면 ============================== */
async function viewList() {
  let rows = await dbAll();
  const allTags = [...new Set(rows.flatMap(r => parseTags(r.tags)))].sort();
  const q = state.q.toLowerCase();
  if (q) rows = rows.filter(r => ((r.title || "") + (r.body || "") + (r.tags || "")).toLowerCase().includes(q));
  if (state.tag) rows = rows.filter(r => parseTags(r.tags).includes(state.tag));
  app.innerHTML = `
    <form class="search" id="sf"><input type="text" id="q" value="${esc(state.q)}" placeholder="검색 (제목·재료·태그)"><button>검색</button></form>
    <div style="margin:8px 0">${allTags.map(t => `<a class="tag ${t === state.tag ? "on" : ""}" data-tag="${esc(t)}">#${esc(t)}</a>`).join("")}</div>
    ${rows.length ? "" : `<p>${state.q || state.tag ? "검색 결과가 없어요." : "아직 레시피가 없어요. 오른쪽 위 “+ 새 레시피”로 시작하세요."}</p>`}
    <div class="grid">${rows.map(r => `
      <div class="item"><input type="checkbox" data-id="${r.id}" ${state.sel.has(r.id) ? "checked" : ""}>
      <a href="#/r/${r.id}"><img loading="lazy" src="${objUrl(r.card)}"></a>
      <div class="t">${esc(r.title)}${pending.has(r.id) ? " ⏳" : ""}</div></div>`).join("")}</div>
    <div class="foot"><small class="hint">레시피는 이 폰의 브라우저에만 저장돼요. 가끔 백업해 두세요.</small>
      <div class="bar"><button class="gray" id="bk">백업 저장</button>
      <button class="gray" id="rs">백업 불러오기</button>
      <input type="file" id="rf" accept=".json,application/json" hidden></div></div>
    <div class="sticky"><button id="pdfSel">선택한 것 PDF (<span id="cnt">${state.sel.size}</span>)</button>
      <button class="gray" id="pdfAll">전체 PDF</button></div>`;
  document.getElementById("sf").onsubmit = e => { e.preventDefault(); state.q = document.getElementById("q").value.trim(); route(); };
  app.querySelectorAll("[data-tag]").forEach(a => a.onclick = () => { state.tag = state.tag === a.dataset.tag ? "" : a.dataset.tag; route(); });
  app.querySelectorAll("input[data-id]").forEach(cb => cb.onchange = () => {
    const id = Number(cb.dataset.id); cb.checked ? state.sel.add(id) : state.sel.delete(id);
    document.getElementById("cnt").textContent = state.sel.size;
  });
  document.getElementById("pdfSel").onclick = () => exportPDF([...state.sel]);
  document.getElementById("pdfAll").onclick = async () => exportPDF((await dbAll()).map(r => r.id));
  document.getElementById("bk").onclick = exportBackup;
  document.getElementById("rs").onclick = () => document.getElementById("rf").click();
  document.getElementById("rf").onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ""; };
}

async function viewForm(id) {
  const r = id ? await dbGet(id) : null;
  if (id && !r) { location.hash = "#/"; return; }
  app.innerHTML = `
    <form id="f">
      <label class="f">요리 이름</label><input type="text" name="title" required value="${esc(r?.title)}">
      <label class="f">레시피 (댓글을 그대로 붙여넣기)</label><textarea name="body" required>${esc(r?.body)}</textarea>
      <label class="f">태그 (쉼표/띄어쓰기로 구분)</label><input type="text" name="tags" value="${esc(r?.tags)}" placeholder="다이어트, 아침, 계란">
      <label class="f">AI 사진 설명 <small class="hint">(비워두면 이름으로 자동, 영어가 더 잘 나와요)</small></label>
      <input type="text" name="prompt" value="${esc(r?.prompt)}" placeholder="egg and cucumber cheese taco, top view">
      <label class="f"><input type="checkbox" name="gen" ${r ? "" : "checked"}> AI 사진 ${r ? "새로 " : ""}생성 <small class="hint">(저장 후 백그라운드에서 만들어져요)</small></label>
      <label class="f">또는 내 사진 직접 선택 <small class="hint">(고르면 AI 생성은 건너뛰어요)</small></label>
      <input type="file" name="photoFile" accept="image/*">
      <div class="bar"><button>저장</button><a class="btn gray" href="#/${id ? "r/" + id : ""}">취소</a></div>
    </form>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const rec = r || { created: new Date().toISOString(), photo: null };
    rec.title = fd.get("title").trim(); rec.body = fd.get("body").trim();
    rec.tags = fd.get("tags").trim(); rec.prompt = fd.get("prompt").trim();
    const file = fd.get("photoFile");
    const hasFile = file && file.size > 0;
    if (hasFile) { try { rec.photo = await shrinkImage(file); } catch { toast("사진을 읽을 수 없어요"); } }
    rec.card = await renderCard(rec);
    const nid = await dbPut(rec);
    if (!hasFile && fd.get("gen")) startGen(nid);
    location.hash = "#/r/" + nid;
  };
}

async function viewOne(id) {
  const r = await dbGet(id);
  if (!r) { location.hash = "#/"; return; }
  const mine = new Set(parseTags(r.tags));
  const related = (await dbAll()).filter(x => x.id !== id && parseTags(x.tags).some(t => mine.has(t))).slice(0, 6);
  app.innerHTML = `
    ${pending.has(id) ? `<div class="note">⏳ AI 사진 생성 중… 끝나면 자동으로 바뀌어요 (최대 1~2분). 다른 화면으로 가도 괜찮아요.</div>` : ""}
    ${failed.has(id) ? `<div class="note">AI 사진 생성에 실패했어요. 인터넷을 확인하고 아래 “AI 사진 다시 생성”을 눌러 주세요.</div>` : ""}
    <div class="card"><img src="${objUrl(r.card)}"></div>
    <div class="bar">
      <button id="dl">이미지 저장</button>
      <button class="gray" id="sh">공유</button>
      <button class="gray" id="pd">PDF</button>
      <button class="gray" id="rg" ${pending.has(id) ? "disabled" : ""}>AI 사진 다시 생성</button>
      <a class="btn gray" href="#/edit/${id}">수정</a>
      <button class="red" id="del">삭제</button>
    </div>
    ${related.length ? `<h4>관련 레시피</h4><div class="grid">${related.map(x => `
      <div class="item"><a href="#/r/${x.id}"><img src="${objUrl(x.card)}"></a><div class="t">${esc(x.title)}</div></div>`).join("")}</div>` : ""}`;
  const fname = safeName(r.title) + ".png";
  document.getElementById("dl").onclick = () => { download(r.card, fname); toast("이미지를 저장했어요"); };
  document.getElementById("sh").onclick = async () => {
    const file = new File([r.card], fname, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: r.title }); } catch {} }
    else toast("이 기기에서는 공유를 쓸 수 없어요. 이미지 저장을 이용하세요");
  };
  document.getElementById("pd").onclick = () => exportPDF([id]);
  document.getElementById("rg").onclick = () => startGen(id);
  document.getElementById("del").onclick = async () => {
    if (!confirm("삭제할까요?")) return;
    await dbDel(id); state.sel.delete(id); location.hash = "#/";
  };
}

/* ============================== 라우터 ============================== */
async function route() {
  urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
  const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  try {
    if (p[0] === "new") await viewForm(null);
    else if (p[0] === "edit" && p[1]) await viewForm(Number(p[1]));
    else if (p[0] === "r" && p[1]) await viewOne(Number(p[1]));
    else await viewList();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="note">문제가 생겼어요: ${esc(e.message || e)}</div>`;
  }
  window.scrollTo(0, 0);
}
function refreshIfRelevant() {
  const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!p.length || (p[0] === "r" && p[1])) {
    const y = window.scrollY; route().then(() => window.scrollTo(0, y));
  }
}
window.addEventListener("hashchange", route);

/* ============================== 시작 ============================== */
route();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
